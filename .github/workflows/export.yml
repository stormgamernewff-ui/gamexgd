name: Export Godot 3D Game (.exe)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  export_windows:
    name: Export Windows EXE
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Export Godot project
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: ./godo
          cache: true
          archive_output: true

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhisperingPines3D-Windows-EXE
          path: ${{ steps.export.outputs.archive_directory }}/*.zip
          retention-days: 14
